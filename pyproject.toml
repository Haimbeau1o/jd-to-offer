[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jd-offer"
version = "0.1.0"
description = "Turn job descriptions into knowledge systems and project blueprints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "jinja2>=3.1",
]

[project.scripts]
jd-offer = "jd_offer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
